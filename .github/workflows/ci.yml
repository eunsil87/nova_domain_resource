name: Validate NOVA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run catalog:generate
      - name: Verify Catalog baseline matches the supplied reference
        run: git diff --exit-code -- src/catalog-baseline.js
      - run: npm run build
      - name: Verify committed offline HTML matches source
        run: git diff --exit-code -- dist/NOVA.html

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>NOVA Focal · 인력관리</title>
    <style>
      :root {
  font-family:
    system-ui,
    -apple-system,
    "Malgun Gothic",
    sans-serif;
  color: #1b2940;
  background: #f5f7fb;
  font-size: 14px;
  --nav: 216px;
  --blue: #2563eb;
  --border: #dce4ef;
  --muted: #687c99;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  min-height: 40px;
  border: 1px solid #cfdced;
  border-radius: 7px;
  background: white;
  color: #1b2940;
  padding: 0 18px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover {
  background: #edf3ff;
  border-color: #9cb9ec;
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
button.primary {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
}
button.danger {
  color: #b42332;
  border-color: #efc7cc;
}
button.ghost {
  border-color: transparent;
  background: transparent;
}
button.small {
  min-height: 32px;
  padding: 0 12px;
  font-size: 12px;
}
button:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid #7da9ff;
  outline-offset: 3px;
}
input,
select,
textarea {
  border: 1px solid #cbd7e8;
  border-radius: 6px;
  padding: 9px 11px;
  min-height: 40px;
  background: white;
  color: #18283f;
  max-width: 100%;
}
input:focus,
select:focus,
textarea:focus {
  outline: 2px solid #98bbff;
  border-color: #2563eb;
}
input:disabled,
select:disabled {
  background: #f2f4f8;
  color: #62738b;
}
input[type="checkbox"] {
  min-height: 18px;
  width: 18px;
  accent-color: var(--blue);
}
input[type="radio"] {
  min-height: 18px;
  width: 18px;
  accent-color: var(--blue);
}
textarea {
  resize: vertical;
  min-height: 82px;
}
h1 {
  font-size: 28px;
  margin: 0 0 8px;
  letter-spacing: -1px;
}
h2 {
  font-size: 18px;
  margin: 0 0 20px;
}
h3 {
  font-size: 15px;
  margin: 0 0 14px;
}
p {
  line-height: 1.65;
}
small,
.muted {
  color: var(--muted);
  font-size: 12px;
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--nav);
  background: #101f35;
  color: white;
  padding: 28px 20px;
  display: flex;
  flex-direction: column;
  z-index: 4;
}
.brand {
  font-size: 26px;
  font-weight: 750;
  letter-spacing: 1px;
}
.brand-sub {
  font-size: 10px;
  color: #8291a6;
  margin: 14px 0 52px;
}
.sidebar nav {
  display: grid;
  gap: 12px;
}
.sidebar nav button {
  border: 0;
  text-align: left;
  color: #cad5e7;
  background: transparent;
  height: 48px;
  padding-left: 14px;
}
.sidebar nav button.active {
  color: white;
  background: var(--blue);
  font-weight: 650;
}
.sidebar footer {
  margin-top: auto;
  display: grid;
  gap: 14px;
  font-size: 12px;
  color: #d5deea;
}
.sidebar footer small {
  color: #7e90a9;
}
header {
  position: sticky;
  top: 0;
  height: 72px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 36px;
  border-bottom: 1px solid #edf1f7;
  z-index: 3;
  margin-left: var(--nav);
}
header strong {
  font-size: 15px;
}
.actions {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.saved {
  font-size: 12px;
  color: var(--muted);
}
.unsaved {
  color: #ac6500;
}
main {
  margin-left: var(--nav);
  padding: 40px 36px 48px;
  min-width: 0;
}
.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  gap: 20px;
}
.heading p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}
.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 24px;
  margin-bottom: 20px;
}
.phase-head {
  display: flex;
  justify-content: space-between;
}
.phase table {
  font-size: 13px;
}
.phase td,
.phase th {
  padding: 12px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
}
.stat {
  padding: 24px;
}
.stat .number {
  font-size: 32px;
  font-weight: 750;
  margin: 12px 0;
}
.stat small {
  display: block;
  font-size: 11px;
}
.blue {
  color: var(--blue);
}
.schedule {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.type-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}
.type-stat {
  background: #f5f7fb;
  padding: 20px;
  border-radius: 7px;
}
.type-stat strong {
  display: block;
  font-size: 24px;
  margin: 10px 0;
}
.table-wrap {
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}
th {
  background: #f5f7fb;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
th,
td {
  padding: 14px 16px;
  border-bottom: 1px solid #edf1f7;
}
tbody tr:last-child td {
  border-bottom: 0;
}
.people-table {
  font-size: 13px;
  min-width: 1000px;
}
.people-table tbody tr {
  cursor: pointer;
}
.people-table tbody tr:hover {
  background: #f2f6ff;
}
.people-table th button {
  padding: 0;
  min-height: 24px;
  background: none;
  border: none;
  color: inherit;
  font-size: inherit;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 22px 0;
  gap: 16px;
}
.badge {
  border-radius: 5px;
  padding: 4px 7px;
  background: #eef3f9;
  font-size: 11px;
  display: inline-block;
}
.badge.current {
  color: #1d5ebc;
  background: #eaf2ff;
}
.badge.tbd {
  color: #946108;
  background: #fff5d8;
}
.check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.tabs {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 20px 0;
}
.tabs button.active {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
}
.line {
  border-top: 1px solid var(--border);
  margin: 22px 0;
}
.chart {
  position: relative;
  margin: 40px 20px 42px 0;
  height: 54px;
  background: #f0f3f8;
  border-radius: 5px;
}
.segment {
  position: absolute;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 600;
  overflow: hidden;
  white-space: nowrap;
}
.segment.confirmed {
  background: #2563eb;
  border-radius: 5px 0 0 5px;
}
.segment.tbd {
  background: #e6a92a;
  color: #513700;
}
.target-line {
  position: absolute;
  top: -14px;
  bottom: -12px;
  border-left: 2px dashed #24334d;
}
.target-label {
  position: absolute;
  top: -30px;
  white-space: nowrap;
  transform: translateX(-50%);
  font-size: 12px;
}
.axis {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
  margin-top: 8px;
}
.legend {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  font-size: 13px;
}
.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  margin-right: 7px;
  background: #2563eb;
}
.dot.yellow {
  background: #e6a92a;
}
.group-layout {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(270px, 1fr);
  gap: 20px;
}
.group-area {
  background: #eff5ff;
  padding: 20px;
  border-radius: 8px;
  min-height: 400px;
}
.group-area.empty {
  padding: 32px;
}
.group-grid {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.group-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px;
  min-width: 230px;
  flex: 1;
  margin-bottom: 16px;
}
.group-member {
  padding: 9px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: grab;
  border: 1px solid transparent;
}
.group-member:hover {
  background: #edf4ff;
}
.group-member button {
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  text-align: left;
  white-space: normal;
}
.leader {
  color: #1b58bb;
}
.parent {
  border: 1px solid #c7d9f9;
  padding: 18px;
  border-radius: 8px;
  margin-bottom: 18px;
}
.parent-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.drop-over {
  outline: 2px dashed #2563eb;
  outline-offset: -2px;
}
.compare-grid {
  display: flex;
  gap: 18px;
  overflow: auto;
}
.compare-plan {
  min-width: 290px;
  flex: 1;
  background: #f5f7fb;
  border-radius: 7px;
  padding: 18px;
}
.compare-person {
  display: grid;
  gap: 3px;
  padding: 10px 0;
  border-bottom: 1px solid #dae3ef;
}
.compare-person.different {
  background: #fff5db;
  padding-left: 8px;
}
.connection {
  max-width: 650px;
  margin: 12vh auto;
  padding: 40px;
}
.connection h1 {
  font-size: 30px;
}
.connection .mark {
  font-size: 13px;
  color: #2563eb;
  letter-spacing: 2px;
  font-weight: bold;
}
.connection .actions {
  margin-top: 26px;
}
.connection .note {
  margin-top: 24px;
  color: var(--muted);
  font-size: 12px;
}
.error {
  background: #fff0f0;
  border: 1px solid #facaca;
  color: #a51c2d;
  border-radius: 6px;
  padding: 12px 16px;
  white-space: pre-wrap;
  line-height: 1.6;
  margin: 16px 0;
}
.notice {
  background: #edf5ff;
  border: 1px solid #d0e1fb;
  border-radius: 6px;
  padding: 14px;
  color: #3b5d8c;
  font-size: 13px;
  line-height: 1.6;
}
.modal-layer {
  position: fixed;
  inset: 0 0 0 var(--nav);
  background: #101f3566;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-layer.startup {
  left: 0;
}
.dialog {
  background: white;
  border-radius: 12px;
  box-shadow: 0 24px 100px #101e3940;
  width: min(780px, 100%);
  max-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.dialog.wide {
  width: min(1240px, 100%);
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 28px;
  border-bottom: 1px solid #e4ebf4;
}
.dialog-head h2 {
  margin: 0;
  font-size: 20px;
}
.dialog-body {
  padding: 26px 28px;
  overflow-y: auto;
}
.dialog-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 28px;
  border-top: 1px solid #e4ebf4;
  gap: 12px;
}
.dialog-foot .right {
  margin-left: auto;
  display: flex;
  gap: 12px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.field > span {
  font-size: 12px;
  font-weight: 600;
}
.field.full {
  grid-column: 1/-1;
}
.field .hint {
  font-size: 11px;
  color: var(--muted);
}
.required {
  color: #cf3747;
}
.date-inputs {
  display: flex;
  gap: 8px;
  align-items: center;
}
.date-inputs input[type="text"] {
  min-width: 0;
  flex: 1;
  width: 100%;
}
.calendar {
  position: relative;
  display: block;
  flex: none;
}
.calendar span {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border: 1px solid #cbd7e8;
  border-radius: 6px;
  background: #f5f8ff;
  font-size: 18px;
}
.calendar input {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 40px;
  cursor: pointer;
  padding: 0;
}
.prefix {
  display: flex;
  border: 1px solid #cbd7e8;
  border-radius: 6px;
  overflow: hidden;
}
.prefix b {
  background: #f2f5fa;
  padding: 10px 12px;
  font-weight: 500;
}
.prefix input {
  border: 0;
  min-width: 0;
  width: 100%;
  border-radius: 0;
}
.ip {
  display: flex;
  align-items: center;
  gap: 5px;
}
.ip input {
  width: 0;
  min-width: 0;
  flex: 1;
  text-align: center;
  padding: 9px 3px;
}
.choice-list {
  display: grid;
  gap: 9px;
}
.choice-list label {
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.choice-list input {
  flex: none;
}
.choice-list span {
  line-height: 1.5;
}
.group-choices {
  max-height: 280px;
  overflow: auto;
}
.settings-tabs {
  display: flex;
  gap: 20px;
  margin-bottom: 28px;
}
.settings-tabs button {
  border: 0;
  background: none;
  min-width: 140px;
  color: var(--muted);
}
.settings-tabs button.active {
  background: #eaf2ff;
  color: var(--blue);
}
.settings-table td {
  background: white;
  border-bottom: 12px solid #f5f7fb;
}
.settings-table th {
  padding-bottom: 25px;
}
.busy {
  pointer-events: none;
  opacity: 0.65;
}
#toast {
  position: fixed;
  bottom: 28px;
  left: calc(50% + var(--nav) / 2);
  transform: translateX(-50%);
  background: #142740;
  color: white;
  padding: 14px 22px;
  border-radius: 9px;
  box-shadow: 0 6px 30px #13294430;
  z-index: 99;
  max-width: 700px;
  white-space: pre-line;
  display: none;
}
#toast.visible {
  display: block;
}
@media (min-width: 1700px) {
  main {
    padding: 42px 48px;
  }
  .people-table td {
    padding-top: 17px;
    padding-bottom: 17px;
  }
}
@media (max-width: 1150px) {
  :root {
    --nav: 170px;
  }
  main {
    padding: 28px 22px;
  }
  header {
    padding: 0 22px;
  }
  .stat .number {
    font-size: 26px;
  }
  .group-layout {
    grid-template-columns: 1fr;
  }
  .heading {
    align-items: flex-start;
  }
  .stats {
    gap: 10px;
  }
  .stat {
    padding: 18px;
  }
  .settings-tabs {
    gap: 6px;
  }
  .settings-tabs button {
    min-width: 0;
  }
}
@media (max-width: 750px) {
  :root {
    --nav: 140px;
  }
  .stats,
  .type-stats,
  .form-grid {
    grid-template-columns: 1fr;
  }
  .heading {
    flex-direction: column;
  }
  .sidebar {
    padding: 22px 10px;
  }
  .brand {
    font-size: 22px;
  }
  .dialog-body {
    padding: 20px;
  }
  .dialog-head,
  .dialog-foot {
    padding: 18px;
  }
  .modal-layer {
    padding: 10px;
  }
  .sidebar nav button {
    padding: 8px;
  }
  .schedule {
    align-items: flex-start;
    flex-direction: column;
  }
}

.group-member {
  padding: 2px;
  break-inside: avoid;
}
.unassigned-members {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-content: start;
  gap: 4px;
}
.unassigned-members .group-member {
  min-width: 0;
}
.unassigned-members button {
  padding: 5px 7px;
  line-height: 1.5;
}
.unassigned-members .group-member small {
  font-size: 10px;
}
.sidebar button.ghost {
  color: #b8cae4;
}
.group-layout > section {
  align-self: start;
}

.root-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: stretch;
}
.root-layout > .parent {
  flex: 0 0 100%;
  min-width: 0;
  margin: 0;
}
.root-layout > .group-card {
  margin: 0;
}
.group-card,
.parent,
[data-drop-unassigned],
.ungroup-drop {
  position: relative;
}
.group-title,
.parent-title > strong {
  cursor: grab;
  user-select: none;
}
.drag-grip {
  display: inline-block;
  margin-right: 8px;
  color: #7892b5;
  font-size: 22px;
  vertical-align: middle;
  line-height: 1;
}
.drag-help {
  font-size: 13px;
  color: #42628d;
  background: #eaf2ff;
  border-radius: 7px;
  padding: 13px 16px;
  min-height: 46px;
  line-height: 1.5;
}
.dragging {
  opacity: 0.45;
}
[data-drop-intent="inside"] {
  outline: 3px dashed #2563eb;
  outline-offset: -3px;
  background: #e8f1ff;
  box-shadow: inset 0 0 0 3px #fff;
}
[data-drop-intent="before"]::before,
[data-drop-intent="after"]::after {
  content: "";
  position: absolute;
  z-index: 2;
  border-radius: 3px;
  background: #2563eb;
  pointer-events: none;
}
[data-drop-axis="horizontal"][data-drop-intent="before"]::before {
  left: -9px;
  top: 0;
  bottom: 0;
  width: 4px;
}
[data-drop-axis="horizontal"][data-drop-intent="after"]::after {
  right: -9px;
  top: 0;
  bottom: 0;
  width: 4px;
}
[data-drop-axis="vertical"][data-drop-intent="before"]::before {
  top: -9px;
  left: 0;
  right: 0;
  height: 4px;
}
[data-drop-axis="vertical"][data-drop-intent="after"]::after {
  bottom: -9px;
  left: 0;
  right: 0;
  height: 4px;
}
.ungroup-drop {
  margin-top: 18px;
  border: 2px dashed #bbcee9;
  border-radius: 7px;
  padding: 18px;
  text-align: center;
  color: #5a7397;
  font-size: 12px;
}
.is-dragging .ungroup-drop {
  border-color: #2563eb;
  color: #1952aa;
}

.phase-now {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: #fff3ef;
  border: 1px solid #f5d7ce;
  border-radius: 6px;
  margin: 0 0 12px;
  font-size: 12px;
}
.phase-now strong {
  color: #b54126;
}
.phase-now span {
  color: #6d4b40;
}
.phase-legend {
  display: flex;
  gap: 18px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 11px;
  margin-bottom: 10px;
}
.phase-dev-dot {
  background: #168477;
}
.phase-legend small {
  font-size: 11px;
}
.phase-timeline {
  display: grid;
  grid-template-columns: 100px minmax(0, 1fr);
  margin-bottom: 16px;
  padding: 0 8px 0 0;
}
.timeline-labels {
  min-width: 0;
}
.timeline-corner {
  height: 34px;
  color: var(--muted);
  font-size: 11px;
  padding-top: 2px;
}
.timeline-row-label {
  height: 48px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  font-size: 12px;
  gap: 3px;
}
.timeline-row-label small {
  color: #b54126;
  font-size: 10px;
}
.timeline-plot {
  position: relative;
  min-width: 0;
}
.timeline-tick {
  position: absolute;
  top: 0;
  bottom: 0;
  border-left: 1px solid #e5eaf2;
  pointer-events: none;
}
.timeline-tick span {
  position: absolute;
  top: 0;
  left: 3px;
  white-space: nowrap;
  font-size: 10px;
  color: var(--muted);
}
.timeline-tick.last span {
  left: auto;
  right: 3px;
}
.timeline-tracks {
  padding-top: 34px;
}
.timeline-track {
  height: 48px;
  position: relative;
  border-bottom: 1px solid #e5eaf2;
  background: #f5f7fb66;
}
.phase-bar {
  position: absolute;
  height: 17px;
  line-height: 17px;
  border-radius: 3px;
  min-width: 1px;
  padding: 0 7px;
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  color: white;
  z-index: 1;
}
.phase-bar.design {
  top: 4px;
  background: #3971cf;
}
.phase-bar.development {
  top: 25px;
  background: #168477;
}
.phase-bar.upcoming {
  opacity: 0.68;
}
.phase-bar.past {
  opacity: 0.48;
}
.phase-bar.current {
  outline: 2px solid #233c65;
  outline-offset: 1px;
  font-weight: 700;
}
.timeline-today {
  position: absolute;
  top: 23px;
  bottom: 0;
  border-left: 2px dashed #c94d30;
  z-index: 2;
  pointer-events: none;
}
.timeline-today > span {
  position: absolute;
  top: -6px;
  left: 0;
  transform: translateX(-50%);
  white-space: nowrap;
  color: white;
  background: #bd452c;
  border-radius: 4px;
  padding: 2px 7px;
  font-size: 10px;
  box-shadow: 0 1px 3px #71210b22;
}
.timeline-today.near-start > span {
  transform: none;
}
.timeline-today.near-end > span {
  transform: translateX(-100%);
}
.phase .phase-dates th,
.phase .phase-dates td {
  padding: 8px 12px;
  font-size: 11px;
}
.phase .phase-note {
  margin-bottom: 0;
  font-size: 11px;
  line-height: 1.5;
}
@media (max-width: 900px) {
  .phase-timeline {
    grid-template-columns: 76px minmax(0, 1fr);
  }
  .timeline-tick:not(:first-child):not(.last) span {
    display: none;
  }
  .phase-bar span {
    display: none;
  }
  .phase-now {
    gap: 5px;
  }
}

    x == null ? 999 : values.indexOf(x) < 0 ? values.length : values.indexOf(x);

    ({

function phaseTimeline(phases, today = todayKST()) {
  dateValue(today);
  if (!phases.length)
    return { rows: [], ticks: [], current: [], position: null, range: "empty" };
  const allDates = phases.flatMap((p) => p.slice(1));
  allDates.forEach(dateValue);
  const start = allDates.reduce((a, b) => (a < b ? a : b)),
    end = allDates.reduce((a, b) => (a > b ? a : b));
  const first = dateValue(start),
    duration = dateValue(end) - first + 86400000;
  const at = (date) => ((dateValue(date) - first) / duration) * 100;
  const rows = phases.map(([name, ds, de, cs, ce]) => ({
    name,
    periods: [
      ["설계", ds, de],
      ["개발", cs, ce],
    ].map(([kind, start, end]) => {
      if (end < start)
        throw Error("Phase 종료일은 시작일보다 빠를 수 없습니다.");
      return {
        kind,
        start,
        end,
        left: at(start),
        width: ((days(start, end) * 86400000) / duration) * 100,
        state: today < start ? "upcoming" : today > end ? "past" : "current",
      };
    }),
  }));
  const ticks = [{ date: start, left: 0 }];
  let year = Number(start.slice(0, 4)),
    month = Number(start.slice(5, 7));
  while (year <= Number(end.slice(0, 4))) {
    if ([1, 4, 7, 10].includes(month)) {
      const date = `${year}-${String(month).padStart(2, "0")}-01`;
      if (date > start && date <= end && at(date) < 95)
        ticks.push({ date, left: at(date) });
    }
    month++;
    if (month === 13) {
      year++;
      month = 1;
    }
    if (`${year}-${String(month).padStart(2, "0")}-01` > end) break;
  }
  // Keep both ends readable for very short custom schedules as well.
  const readable = ticks.filter(
    (t, i) => i === 0 || (t.left >= 8 && t.left <= 92),
  );
  if (days(start, end) > 1) readable.push({ date: end, left: 100 });
  return {
    rows,
    ticks: readable,
    start,
    end,
    position: Math.max(0, Math.min(100, at(today))),
    range: today < start ? "before" : today > end ? "after" : "during",
    current: rows.flatMap((row) =>
      row.periods
        .filter((p) => p.state === "current")
        .map((p) => `${row.name} ${p.kind}`),
    ),
  };
}

class FolderStore {
  constructor(directory) {
    this.directory = directory;
    this.version = null;
    this.baseline = null;
    this.exists = false;
  }
  async permission(request = false) {
    const options = { mode: "readwrite" };
    let state = await this.directory.queryPermission(options);
    if (state !== "granted" && request)
      state = await this.directory.requestPermission(options);

      throw e;
    }
  }
  async raw() {
    try {
      return await (await this.directory.getFileHandle(DATA_FILE))
        .getFile()
        .then((f) => f.text());
    } catch (e) {
      if (e.name === "NotFoundError") return null;
      throw e;
    }
  }
  async load() {
    await this.permission();
    const raw = await this.raw();
    if (raw === null) {
      this.exists = false;
      this.baseline = null;
      this.version = null;
      return null;
    }
    let d;
    try {
      d = validateData(JSON.parse(raw));
    } catch (e) {
      throw Error("데이터를 읽을 수 없습니다. " + e.message);
    }
    this.exists = true;
    this.baseline = raw;
    this.version = d.saveVersion;
    return d;
  }
  async save(data) {
    await this.permission();
    validateData(data);
    const current = await this.raw();
    if (current !== this.baseline)
      throw Error(
        "다른 탭 또는 프로그램에서 데이터가 변경되었습니다. 저장을 중단했습니다. 현재 작업을 확인하고 새로고침해 주세요.",
      );
    const out = clone(data);
    out.saveVersion = (this.version ?? 0) + 1;
    const text = JSON.stringify(out, null, 2) + "\n";
    const handle = await this.directory.getFileHandle(DATA_FILE, {
      create: true,
    });
    let stream;
    try {
      stream = await handle.createWritable();
      await stream.write(text);
      await stream.close();
    } catch (e) {
      if (stream)
        try {
          await stream.abort();
        } catch {}

    this.baseline = text;
    this.version = out.saveVersion;
    return out;
  }
}

        "폴더 연결을 기억하지 못했습니다. 다음 실행 시 다시 연결해 주세요.",
      );

  } catch (e) {
    if (previous.ready) {
      Object.assign(state, previous);
      toast("연결을 변경하지 못했습니다. " + e.message);
    } else {
      state.ready = false;
      state.error = [
        "NotAllowedError",
        "NotFoundError",
        "SecurityError",
      ].includes(e.name)
        ? "앱 폴더 연결 또는 접근 권한을 다시 확인해 주세요."

    }

    state.busy = false;

  }

function projectDialog() {

function masterDialog(key, id = null, onChanged = null) {
  const old = state.data[key].find((x) => x.id === id),
    used =
      key === "companies" && state.data.people.some((p) => p.companyId === id);
  dialog({
    title: `${{ companies: "업체", roles: "역할", technologies: "기술 구분" }[key]} ${old ? "수정" : "추가"}`,
    body: `<div class="form-grid">${field("이름", textInput("name", old?.name ?? "", 'required maxlength="100"'))}${key === "companies" ? field("직원 타입", `<select name="type" ${used ? "disabled" : ""}>${["정직원", "BP", "AGS"].map((t) => option(t, t, t === (old?.type ?? "BP"))).join("")}</select>`, false, used ? "인력이 참조하는 업체의 타입은 변경할 수 없습니다." : "") : ""}${field("사용 상태", `<select name="active">${option("true", "사용", old?.active !== false)}${option("false", "사용 안 함", old?.active === false)}</select>`)}</div>`,
    onApply: async (f) => {
      await mutate((d) => {
        const name = uniqueName(d[key], f.elements.name.value, id),
          active = f.elements.active.value === "true";
        if (old) {
          const x = d[key].find((x) => x.id === id);
          if (key === "companies" && !used) x.type = f.elements.type.value;
          x.name = name;
          x.active = active;
        } else
          d[key].push({
            id: uid(),
            name,
            active,
            ...(key === "companies" ? { type: f.elements.type.value } : {}),
          });
      });
      onChanged?.();
    },
  });
}
let dragData = null;
function bindDrag() {
  const root = $("main");
  if (!root) return;
  let pendingDrop = null;
  const defaultHint = $("#drag-feedback")?.textContent;
  const clearMarkers = () =>
    root.querySelectorAll("[data-drop-intent]").forEach((el) => {
      el.removeAttribute("data-drop-intent");
      el.removeAttribute("data-drop-axis");
    });
  const describe = (e, drag) => {
    if (!drag || drag.planId !== viewedPlan().id) return null;
    const card = e.target.closest("[data-drop-group]"),
      parent = e.target.closest("[data-drop-parent]"),
      unassigned = e.target.closest("[data-drop-unassigned]"),
      outside = e.target.closest("[data-drop-ungrouped]");
    const side = (el, axis) => {
      const r = el.getBoundingClientRect();
      return (
        axis === "horizontal"
          ? e.clientX < r.x + r.width / 2
          : e.clientY < r.y + r.height / 2
      )
        ? "before"
        : "after";
    };
    if (drag.person) {
      if (card)
        return {
          el: card,
          kind: "person",
          groupId: card.dataset.dropGroup,
          beforePerson:
            e.target.closest("[data-drop-person]")?.dataset.dropPerson,
          label: "이 그룹에 인력 배정",
          intent: "inside",
        };
      if (unassigned)
        return {
          el: unassigned,
          kind: "person",
          label: "미배정으로 이동",
          intent: "inside",
        };
      return null;
    }
    if (drag.parent) {
      const el = parent || card;
      if (el) {
        const id = parent?.dataset.dropParent || card.dataset.dropGroup;
        if (id === drag.parent) return null;
        const intent = side(el, "vertical");
        return {
          el,
          kind: "parent",
          anchorId: id,
          after: intent === "after",
          intent,
          axis: "vertical",
          label:
            intent === "after" ? "이 항목 뒤로 이동" : "이 항목 앞으로 이동",
        };
      }
      if (outside)
        return {
          el: outside,
          kind: "parent",
          intent: "inside",
          label: "맨 뒤로 이동",
        };
      return null;
    }
    if (drag.group) {
      if (card) {
        if (card.dataset.dropGroup === drag.group) return null;
        const r = card.getBoundingClientRect(),
          horizontal = Math.min(48, r.width * 0.18),
          vertical = Math.min(32, r.height * 0.18);
        let intent = null,
          axis = "horizontal";
        if (e.clientX < r.x + horizontal) intent = "before";
        else if (e.clientX > r.right - horizontal) intent = "after";
        else if (e.clientY < r.y + vertical) {
          intent = "before";
          axis = "vertical";
        } else if (e.clientY > r.bottom - vertical) {
          intent = "after";
          axis = "vertical";
        }
        const parentId = parent?.dataset.dropParent ?? null;
        if (intent)
          return {
            el: card,
            kind: "group",
            parentId,
            anchorId: card.dataset.dropGroup,
            after: intent === "after",
            intent,
            axis,
            label:
              intent === "after" ? "이 그룹 뒤로 이동" : "이 그룹 앞으로 이동",
          };
        if (parentId)
          return {
            el: card,
            kind: "group",
            parentId,
            anchorId: card.dataset.dropGroup,
            after: true,
            intent: "inside",
            label:
              viewedPlan().parents.find((p) => p.groupIds.includes(drag.group))
                ?.id === parentId
                ? "이 그룹 뒤로 이동"
                : "이 상위 그룹에 넣기",
          };
        return {
          el: card,
          kind: "bundle",
          anchorId: card.dataset.dropGroup,
          intent: "inside",
          label: "두 그룹을 상위 그룹으로 묶기",
        };
      }
      if (parent) {
        const r = parent.getBoundingClientRect();
        if (e.clientY < r.y + 18 || e.clientY > r.bottom - 18) {
          const intent = side(parent, "vertical");
          return {
            el: parent,
            kind: "group",
            anchorId: parent.dataset.dropParent,
            parentId: null,
            after: intent === "after",
            intent,
            axis: "vertical",
            label:
              intent === "after"
                ? "상위 그룹 뒤에 독립 배치"
                : "상위 그룹 앞에 독립 배치",
          };
        }
        return {
          el: parent,
          kind: "group",
          parentId: parent.dataset.dropParent,
          intent: "inside",
          label: "이 상위 그룹에 넣기",
        };
      }
      if (outside)
        return {
          el: outside,
          kind: "group",
          parentId: null,
          intent: "inside",
          label: "상위 그룹 밖, 맨 뒤로 이동",
        };
    }
    return null;
  };
  root.querySelectorAll("[draggable=true]").forEach((el) =>
    el.addEventListener("dragstart", (e) => {
      e.stopPropagation();
      dragData = {
        planId: viewedPlan().id,
        person: el.dataset.dragPerson,
        group: el.dataset.dragGroup,
        parent: el.dataset.dragParent,
      };
      el.classList.add("dragging");
      root.classList.add("is-dragging");
      e.dataTransfer.setData("text/plain", "nova-move");
      e.dataTransfer.effectAllowed = "move";
    }),
  );
  root.addEventListener("dragover", (e) => {
    const target = describe(e, dragData);
    clearMarkers();
    if (target) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      target.el.dataset.dropIntent = target.intent;
      target.el.dataset.dropAxis = target.axis || "horizontal";
    }
    const feedback = $("#drag-feedback");
    if (feedback) feedback.textContent = target?.label || defaultHint;
  });
  root.addEventListener("dragleave", (e) => {
    if (!root.contains(e.relatedTarget)) clearMarkers();
  });
  root.addEventListener("drop", (e) => {
    const target = describe(e, dragData),
      drag = dragData;
    if (!target) return;
    e.preventDefault();
    pendingDrop = async () => {
      try {
        if (target.kind === "bundle") {
          parentDialog(null, {
            planId: drag.planId,
            groupIds: [target.anchorId, drag.group],
            anchorId: target.anchorId,
          });
          return;
        }
        await mutate((d) => {
          const plan = d.plans.find((p) => p.id === drag.planId);
          if (!plan) throw Error("구성안이 없습니다.");
          if (target.kind === "person") {
            const p = d.people.find((p) => p.id === drag.person);
            if (!p || status(p) === "종료") return;
            const was = plan.groups.find((g) => g.members.includes(p.id)),
              oldIndex = was?.members.indexOf(p.id);
            for (const g of plan.groups)
              g.members = g.members.filter((id) => id !== p.id);
            const group = plan.groups.find((g) => g.id === target.groupId);
            if (group) {
              let index =
                target.beforePerson === p.id
                  ? oldIndex
                  : group.members.indexOf(target.beforePerson);
              if (index < 0) index = group.members.length;
              group.members.splice(index, 0, p.id);
            }
          } else if (target.kind === "group")
            moveGroup(plan, drag.group, target);
          else if (target.kind === "parent")
            moveParent(plan, drag.parent, target.anchorId, target.after);
          cleanGroups(d);
        });
      } catch (e) {
        toast(e.message);
      }
    };
  });
  root.addEventListener("dragend", () => {
    dragData = null;
    clearMarkers();
    root.classList.remove("is-dragging");
    root
      .querySelectorAll(".dragging")
      .forEach((el) => el.classList.remove("dragging"));
    const feedback = $("#drag-feedback");
    if (feedback) feedback.textContent = defaultHint;
    const run = pendingDrop;
    pendingDrop = null;
    if (run) setTimeout(run, 0);
  });
}
window.addEventListener("beforeunload", (e) => {
  if (state.dirty || dialogs.some((x) => x.isDirty())) {
    e.preventDefault();
    e.returnValue = "";
  }
});
// Refresh derived date displays across midnight without running persistent startup cleanup.
let renderedDate = todayKST();
function refreshDateDisplay() {
  const date = todayKST();
  if (
    !state.ready ||
    document.hidden ||
    dialogs.length ||
    date === renderedDate
  )
    return;
  renderedDate = date;
  render(true);
}
document.addEventListener("visibilitychange", refreshDateDisplay);
setInterval(refreshDateDisplay, 60000);
async function boot() {
  renderConnection();
  try {
    const handle = await recalledHandle();
    if (handle) {
      state.handle = handle;
      const permission = await handle.queryPermission({ mode: "readwrite" });
      if (permission === "granted") await openHandle(handle);
      else renderConnection();
    }
  } catch {
    state.error =
      "폴더 연결 정보를 기억하지 못했습니다. 앱 폴더를 다시 연결해 주세요.";
    renderConnection();
  }
}
boot();

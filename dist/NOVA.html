<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>NOVA Focal · 인력관리</title>
    <style>
      :root {
  font-family:
    system-ui,
    -apple-system,
    "Malgun Gothic",
    sans-serif;
  color: #1b2940;
  background: #f5f7fb;
  font-size: 14px;
  --nav: 216px;
  --blue: #2563eb;
  --border: #dce4ef;
  --muted: #687c99;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  min-height: 40px;
  border: 1px solid #cfdced;
  border-radius: 7px;
  background: white;
  color: #1b2940;
  padding: 0 18px;
  cursor: pointer;
  white-space: nowrap;
}
button:hover {
  background: #edf3ff;
  border-color: #9cb9ec;
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
button.primary {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
}
button.danger {
  color: #b42332;
  border-color: #efc7cc;
}
button.ghost {
  border-color: transparent;
  background: transparent;
}
button.small {
  min-height: 32px;
  padding: 0 12px;
  font-size: 12px;
}
button:focus-visible,
a:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid #7da9ff;
  outline-offset: 3px;
}
input,
select,
textarea {
  border: 1px solid #cbd7e8;
  border-radius: 6px;
  padding: 9px 11px;
  min-height: 40px;
  background: white;
  color: #18283f;
  max-width: 100%;
}
input:focus,
select:focus,
textarea:focus {
  outline: 2px solid #98bbff;
  border-color: #2563eb;
}
input:disabled,
select:disabled {
  background: #f2f4f8;
  color: #62738b;
}
input[type="checkbox"] {
  min-height: 18px;
  width: 18px;
  accent-color: var(--blue);
}
input[type="radio"] {
  min-height: 18px;
  width: 18px;
  accent-color: var(--blue);
}
textarea {
  resize: vertical;
  min-height: 82px;
}
h1 {
  font-size: 28px;
  margin: 0 0 8px;
  letter-spacing: -1px;
}
h2 {
  font-size: 18px;
  margin: 0 0 20px;
}
h3 {
  font-size: 15px;
  margin: 0 0 14px;
}
p {
  line-height: 1.65;
}
small,
.muted {
  color: var(--muted);
  font-size: 12px;
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--nav);
  background: #101f35;
  color: white;
  padding: 28px 20px;
  display: flex;
  flex-direction: column;
  z-index: 4;
}
.brand {
  font-size: 26px;
  font-weight: 750;
  letter-spacing: 1px;
}
.brand-sub {
  font-size: 10px;
  color: #8291a6;
  margin: 14px 0 52px;
}
.sidebar nav {
  display: grid;
  gap: 12px;
}
.sidebar nav button {
  border: 0;
  text-align: left;
  color: #cad5e7;
  background: transparent;
  height: 48px;
  padding-left: 14px;
}
.sidebar nav button.active {
  color: white;
  background: var(--blue);
  font-weight: 650;
}
.sidebar footer {
  margin-top: auto;
  display: grid;
  gap: 14px;
  font-size: 12px;
  color: #d5deea;
}
.sidebar footer small {
  color: #7e90a9;
}
header {
  position: sticky;
  top: 0;
  height: 72px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 36px;
  border-bottom: 1px solid #edf1f7;
  z-index: 3;
  margin-left: var(--nav);
}
header strong {
  font-size: 15px;
}
.actions {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.saved {
  font-size: 12px;
  color: var(--muted);
}
.unsaved {
  color: #ac6500;
}
main {
  margin-left: var(--nav);
  padding: 40px 36px 48px;
  min-width: 0;
}
.heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  gap: 20px;
}
.heading p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}
.card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 24px;
  margin-bottom: 20px;
}
.phase-head {
  display: flex;
  justify-content: space-between;
}
.phase table {
  font-size: 13px;
}
.phase td,
.phase th {
  padding: 12px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
}
.stat {
  padding: 24px;
}
.stat .number {
  font-size: 32px;
  font-weight: 750;
  margin: 12px 0;
}
.stat small {
  display: block;
  font-size: 11px;
}
.blue {
  color: var(--blue);
}
.schedule {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}
.type-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}
.type-stat {
  background: #f5f7fb;
  padding: 20px;
  border-radius: 7px;
}
.type-stat strong {
  display: block;
  font-size: 24px;
  margin: 10px 0;
}
.table-wrap {
  overflow: auto;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
}
th {
  background: #f5f7fb;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  white-space: nowrap;
}
th,
td {
  padding: 14px 16px;
  border-bottom: 1px solid #edf1f7;
}
tbody tr:last-child td {
  border-bottom: 0;
}
.people-table {
  font-size: 13px;
  min-width: 1000px;
}
.people-table tbody tr {
  cursor: pointer;
}
.people-table tbody tr:hover {
  background: #f2f6ff;
}
.people-table th button {
  padding: 0;
  min-height: 24px;
  background: none;
  border: none;
  color: inherit;
  font-size: inherit;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 22px 0;
  gap: 16px;
}
.badge {
  border-radius: 5px;
  padding: 4px 7px;
  background: #eef3f9;
  font-size: 11px;
  display: inline-block;
}
.badge.current {
  color: #1d5ebc;
  background: #eaf2ff;
}
.badge.tbd {
  color: #946108;
  background: #fff5d8;
}
.check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.tabs {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin: 20px 0;
}
.tabs button.active {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
}
.line {
  border-top: 1px solid var(--border);
  margin: 22px 0;
}
.chart {
  position: relative;
  margin: 40px 20px 42px 0;
  height: 54px;
  background: #f0f3f8;
  border-radius: 5px;
}
.segment {
  position: absolute;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 600;
  overflow: hidden;
  white-space: nowrap;
}
.segment.confirmed {
  background: #2563eb;
  border-radius: 5px 0 0 5px;
}
.segment.tbd {
  background: #e6a92a;
  color: #513700;
}
.target-line {
  position: absolute;
  top: -14px;
  bottom: -12px;
  border-left: 2px dashed #24334d;
}
.target-label {
  position: absolute;
  top: -30px;
  white-space: nowrap;
  transform: translateX(-50%);
  font-size: 12px;
}
.axis {
  display: flex;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
  margin-top: 8px;
}
.legend {
  display: flex;
  gap: 24px;
  flex-wrap: wrap;
  font-size: 13px;
}
.dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  margin-right: 7px;
  background: #2563eb;
}
.dot.yellow {
  background: #e6a92a;
}
.group-layout {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(270px, 1fr);
  gap: 20px;
}
.group-area {
  background: #eff5ff;
  padding: 20px;
  border-radius: 8px;
  min-height: 400px;
}
.group-area.empty {
  padding: 32px;
}
.group-grid {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.group-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 18px;
  min-width: 230px;
  flex: 1;
  margin-bottom: 16px;
}
.group-member {
  padding: 9px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  gap: 7px;
  cursor: grab;
  border: 1px solid transparent;
}
.group-member:hover {
  background: #edf4ff;
}
.group-member button {
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  text-align: left;
  white-space: normal;
}
.leader {
  color: #1b58bb;
}
.parent {
  border: 1px solid #c7d9f9;
  padding: 18px;
  border-radius: 8px;
  margin-bottom: 18px;
}
.parent-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.drop-over {
  outline: 2px dashed #2563eb;
  outline-offset: -2px;
}
.compare-grid {
  display: flex;
  gap: 18px;
  overflow: auto;
}
.compare-plan {
  min-width: 290px;
  flex: 1;
  background: #f5f7fb;
  border-radius: 7px;
  padding: 18px;
}
.compare-person {
  display: grid;
  gap: 3px;
  padding: 10px 0;
  border-bottom: 1px solid #dae3ef;
}
.compare-person.different {
  background: #fff5db;
  padding-left: 8px;
}
.connection {
  max-width: 650px;
  margin: 12vh auto;
  padding: 40px;
}
.connection h1 {
  font-size: 30px;
}
.connection .mark {
  font-size: 13px;
  color: #2563eb;
  letter-spacing: 2px;
  font-weight: bold;
}
.connection .actions {
  margin-top: 26px;
}
.connection .note {
  margin-top: 24px;
  color: var(--muted);
  font-size: 12px;
}
.error {
  background: #fff0f0;
  border: 1px solid #facaca;
  color: #a51c2d;
  border-radius: 6px;
  padding: 12px 16px;
  white-space: pre-wrap;
  line-height: 1.6;
  margin: 16px 0;
}
.notice {
  background: #edf5ff;
  border: 1px solid #d0e1fb;
  border-radius: 6px;
  padding: 14px;
  color: #3b5d8c;
  font-size: 13px;
  line-height: 1.6;
}
.modal-layer {
  position: fixed;
  inset: 0 0 0 var(--nav);
  background: #101f3566;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-layer.startup {
  left: 0;
}
.dialog {
  background: white;
  border-radius: 12px;
  box-shadow: 0 24px 100px #101e3940;
  width: min(780px, 100%);
  max-height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.dialog.wide {
  width: min(1240px, 100%);
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 28px;
  border-bottom: 1px solid #e4ebf4;
}
.dialog-head h2 {
  margin: 0;
  font-size: 20px;
}
.dialog-body {
  padding: 26px 28px;
  overflow-y: auto;
}
.dialog-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 28px;
  border-top: 1px solid #e4ebf4;
  gap: 12px;
}
.dialog-foot .right {
  margin-left: auto;
  display: flex;
  gap: 12px;
}
.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
}
.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.field > span {
  font-size: 12px;
  font-weight: 600;
}
.field.full {
  grid-column: 1/-1;
}
.field .hint {
  font-size: 11px;
  color: var(--muted);
}
.required {
  color: #cf3747;
}
.date-inputs {
  display: flex;
  gap: 8px;
  align-items: center;
}
.date-inputs input[type="text"] {
  min-width: 0;
  flex: 1;
  width: 100%;
}
.calendar {
  position: relative;
  display: block;
  flex: none;
}
.calendar span {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border: 1px solid #cbd7e8;
  border-radius: 6px;
  background: #f5f8ff;
  font-size: 18px;
}
.calendar input {
  position: absolute;
  inset: 0;
  opacity: 0;
  width: 40px;
  cursor: pointer;
  padding: 0;
}
.prefix {
  display: flex;
  border: 1px solid #cbd7e8;
  border-radius: 6px;
  overflow: hidden;
}
.prefix b {
  background: #f2f5fa;
  padding: 10px 12px;
  font-weight: 500;
}
.prefix input {
  border: 0;
  min-width: 0;
  width: 100%;
  border-radius: 0;
}
.ip {
  display: flex;
  align-items: center;
  gap: 5px;
}
.ip input {
  width: 0;
  min-width: 0;
  flex: 1;
  text-align: center;
  padding: 9px 3px;
}
.choice-list {
  display: grid;
  gap: 9px;
}
.choice-list label {
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  display: flex;
  gap: 10px;
  align-items: center;
}
.choice-list input {
  flex: none;
}
.choice-list span {
  line-height: 1.5;
}
.group-choices {
  max-height: 280px;
  overflow: auto;
}
.settings-tabs {
  display: flex;
  gap: 20px;
  margin-bottom: 28px;
}
.settings-tabs button {
  border: 0;
  background: none;
  min-width: 140px;
  color: var(--muted);
}
.settings-tabs button.active {
  background: #eaf2ff;
  color: var(--blue);
}
.settings-table td {
  background: white;
  border-bottom: 12px solid #f5f7fb;
}
.settings-table th {
  padding-bottom: 25px;
}
.busy {
  pointer-events: none;
  opacity: 0.65;
}
#toast {
  position: fixed;
  bottom: 28px;
  left: calc(50% + var(--nav) / 2);
  transform: translateX(-50%);
  background: #142740;
  color: white;
  padding: 14px 22px;
  border-radius: 9px;
  box-shadow: 0 6px 30px #13294430;
  z-index: 99;
  max-width: 700px;
  white-space: pre-line;
  display: none;
}
#toast.visible {
  display: block;
}
@media (min-width: 1700px) {
  main {
    padding: 42px 48px;
  }
  .people-table td {
    padding-top: 17px;
    padding-bottom: 17px;
  }
}
@media (max-width: 1150px) {
  :root {
    --nav: 170px;
  }
  main {
    padding: 28px 22px;
  }
  header {
    padding: 0 22px;
  }
  .stat .number {
    font-size: 26px;
  }
  .group-layout {
    grid-template-columns: 1fr;
  }
  .heading {
    align-items: flex-start;
  }
  .stats {
    gap: 10px;
  }
  .stat {
    padding: 18px;
  }
  .settings-tabs {
    gap: 6px;
  }
  .settings-tabs button {
    min-width: 0;
  }
}
@media (max-width: 750px) {
  :root {
    --nav: 140px;
  }
  .stats,
  .type-stats,
  .form-grid {
    grid-template-columns: 1fr;
  }
  .heading {
    flex-direction: column;
  }
  .sidebar {
    padding: 22px 10px;
  }
  .brand {
    font-size: 22px;
  }
  .dialog-body {
    padding: 20px;
  }
  .dialog-head,
  .dialog-foot {
    padding: 18px;
  }
  .modal-layer {
    padding: 10px;
  }
  .sidebar nav button {
    padding: 8px;
  }
  .schedule {
    align-items: flex-start;
    flex-direction: column;
  }
}

.group-member {
  padding: 2px;
  break-inside: avoid;
}
.unassigned-members {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-content: start;
  gap: 4px;
}
.unassigned-members .group-member {
  min-width: 0;
}
.unassigned-members button {
  padding: 5px 7px;
  line-height: 1.5;
}
.unassigned-members .group-member small {
  font-size: 10px;
}
.sidebar button.ghost {
  color: #b8cae4;
}
.group-layout > section {
  align-self: start;
}

.root-layout {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: stretch;
}
.root-layout > .parent {
  flex: 0 0 100%;
  min-width: 0;
  margin: 0;
}
.root-layout > .group-card {
  margin: 0;
}
.group-card,
.parent,
[data-drop-unassigned],
.ungroup-drop {
  position: relative;
}
.group-title,
.parent-title > strong {
  cursor: grab;
  user-select: none;
}
.drag-grip {
  display: inline-block;
  margin-right: 8px;
  color: #7892b5;
  font-size: 22px;
  vertical-align: middle;
  line-height: 1;
}
.drag-help {
  font-size: 13px;
  color: #42628d;
  background: #eaf2ff;
  border-radius: 7px;
  padding: 13px 16px;
  min-height: 46px;
  line-height: 1.5;
}
.dragging {
  opacity: 0.45;
}
[data-drop-intent="inside"] {
  outline: 3px dashed #2563eb;
  outline-offset: -3px;
  background: #e8f1ff;
  box-shadow: inset 0 0 0 3px #fff;
}
[data-drop-intent="before"]::before,
[data-drop-intent="after"]::after {
  content: "";
  position: absolute;
  z-index: 2;
  border-radius: 3px;
  background: #2563eb;
  pointer-events: none;
}
[data-drop-axis="horizontal"][data-drop-intent="before"]::before {
  left: -9px;
  top: 0;
  bottom: 0;
  width: 4px;
}
[data-drop-axis="horizontal"][data-drop-intent="after"]::after {
  right: -9px;
  top: 0;
  bottom: 0;
  width: 4px;
}
[data-drop-axis="vertical"][data-drop-intent="before"]::before {
  top: -9px;
  left: 0;
  right: 0;
  height: 4px;
}
[data-drop-axis="vertical"][data-drop-intent="after"]::after {
  bottom: -9px;
  left: 0;
  right: 0;
  height: 4px;
}
.ungroup-drop {
  margin-top: 18px;
  border: 2px dashed #bbcee9;
  border-radius: 7px;
  padding: 18px;
  text-align: center;
  color: #5a7397;
  font-size: 12px;
}
.is-dragging .ungroup-drop {
  border-color: #2563eb;
  color: #1952aa;
}

.phase-now {
  display: flex;
  gap: 16px;
  align-items: center;
  flex-wrap: wrap;
  padding: 10px 14px;
  background: #fff3ef;
  border: 1px solid #f5d7ce;
  border-radius: 6px;
  margin: 0 0 12px;
  font-size: 12px;
}
.phase-now strong {
  color: #b54126;
}
.phase-now span {
  color: #6d4b40;
}
.phase-legend {
  display: flex;
  gap: 18px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 11px;
  margin-bottom: 10px;
}
.phase-dev-dot {
  background: #168477;
}
.phase-legend small {
  font-size: 11px;
}
.phase-timeline {
  display: grid;
  grid-template-columns: 100px minmax(0, 1fr);
  margin-bottom: 16px;
  padding: 0 8px 0 0;
}
.timeline-labels {
  min-width: 0;
}
.timeline-corner {
  height: 34px;
  color: var(--muted);
  font-size: 11px;
  padding-top: 2px;
}
.timeline-row-label {
  height: 48px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  font-size: 12px;
  gap: 3px;
}
.timeline-row-label small {
  color: #b54126;
  font-size: 10px;
}
.timeline-plot {
  position: relative;
  min-width: 0;
}
.timeline-tick {
  position: absolute;
  top: 0;
  bottom: 0;
  border-left: 1px solid #e5eaf2;
  pointer-events: none;
}
.timeline-tick span {
  position: absolute;
  top: 0;
  left: 3px;
  white-space: nowrap;
  font-size: 10px;
  color: var(--muted);
}
.timeline-tick.last span {
  left: auto;
  right: 3px;
}
.timeline-tracks {
  padding-top: 34px;
}
.timeline-track {
  height: 48px;
  position: relative;
  border-bottom: 1px solid #e5eaf2;
  background: #f5f7fb66;
}
.phase-bar {
  position: absolute;
  height: 17px;
  line-height: 17px;
  border-radius: 3px;
  min-width: 1px;
  padding: 0 7px;
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  color: white;
  z-index: 1;
}
.phase-bar.design {
  top: 4px;
  background: #3971cf;
}
.phase-bar.development {
  top: 25px;
  background: #168477;
}
.phase-bar.upcoming {
  opacity: 0.68;
}
.phase-bar.past {
  opacity: 0.48;
}
.phase-bar.current {
  outline: 2px solid #233c65;
  outline-offset: 1px;
  font-weight: 700;
}
.timeline-today {
  position: absolute;
  top: 23px;
  bottom: 0;
  border-left: 2px dashed #c94d30;
  z-index: 2;
  pointer-events: none;
}
.timeline-today > span {
  position: absolute;
  top: -6px;
  left: 0;
  transform: translateX(-50%);
  white-space: nowrap;
  color: white;
  background: #bd452c;
  border-radius: 4px;
  padding: 2px 7px;
  font-size: 10px;
  box-shadow: 0 1px 3px #71210b22;
}
.timeline-today.near-start > span {
  transform: none;
}
.timeline-today.near-end > span {
  transform: translateX(-100%);
}
.phase .phase-dates th,
.phase .phase-dates td {
  padding: 8px 12px;
  font-size: 11px;
}
.phase .phase-note {
  margin-bottom: 0;
  font-size: 11px;
  line-height: 1.5;
}
@media (max-width: 900px) {
  .phase-timeline {
    grid-template-columns: 76px minmax(0, 1fr);
  }
  .timeline-tick:not(:first-child):not(.last) span {
    display: none;
  }
  .phase-bar span {
    display: none;
  }
  .phase-now {
    gap: 5px;
  }
}

.catalog-counts {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  margin: 20px 0;
}
.catalog-counts > div,
.catalog-counts > button {
  background: white;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  text-align: left;

}
.catalog-counts strong {

}
.catalog-counts small {
  display: block;
  font-size: 11px;

.catalog-counts button.selected {

}
.catalog-filters {

.catalog-filters select {

.catalog-filter-panel {

const CATALOG_LEVELS = [
  { key: "domains", label: "도메인", parent: null },
  { key: "l2", label: "L2", parent: "domains" },
  { key: "subcomponents", label: "Sub Component", parent: "l2" },
  { key: "l3", label: "L3", parent: "subcomponents" },
  { key: "l4", label: "L4", parent: "l3" },

function emptyCatalog() {
  return {
    version: 1,
    sourceVersion: null,
    domains: [],
    l2: [],
    subcomponents: [],
    l3: [],
    l4: [],
  };
}
function baselineCatalog() {
  return structuredClone(CATALOG_BASELINE);
}
function catalogLevel(key) {
  const level = CATALOG_LEVELS.find((x) => x.key === key);
  if (!level) throw Error("유효한 Catalog 계층이 아닙니다.");
  return level;
}
function catalogPath(catalog, key, id) {
  const path = [];
  let level = catalogLevel(key),
    node = catalog[key].find((x) => x.id === id);
  while (node) {
    path.unshift({ ...node, level: level.key });
    if (!level.parent) break;
    level = catalogLevel(level.parent);
    node = catalog[level.key].find((x) => x.id === node.parentId);
  }
  return path;
}
function catalogRows(
  catalog,
  key,
  filters = {},
  query = "",
  requirement = "all",
  phase = "all",
) {
  catalogLevel(key);
  const q = query.trim().toLocaleLowerCase("ko");
  return catalog[key].filter((node) => {
    const path = catalogPath(catalog, key, node.id);
    return (
      Object.entries(filters).every(
        ([level, id]) =>
          !id || path.some((p) => p.level === level && p.id === id),
      ) &&
      (!q ||
        [node.code, node.name, node.koreanName, node.description].some(
          (value) =>
            String(value ?? "")
              .toLocaleLowerCase("ko")
              .includes(q),
        )) &&
      (key !== "l4" ||
        phase === "all" ||
        (phase === "unassigned"
          ? node.phase == null
          : node.phase === Number(phase))) &&
      (key !== "l4" ||
        requirement === "all" ||
        node.required === (requirement === "required"))
    );
  });
}
function catalogCounts(catalog) {
  return {
    ...Object.fromEntries(
      CATALOG_LEVELS.map((l) => [l.key, catalog[l.key].length]),
    ),
    required: catalog.l4.filter((x) => x.required).length,
    optional: catalog.l4.filter((x) => !x.required).length,
  };
}
function upsertCatalogNode(catalog, key, input, id = null) {
  const level = catalogLevel(key),
    old = id ? catalog[key].find((x) => x.id === id) : null;
  if (id && !old) throw Error("수정할 항목이 없습니다.");
  const code = String(input.code ?? "").trim(),
    name =
      String(input.name ?? "").trim() ||
      (catalog.version === 2 ? String(input.koreanName ?? " ").trim() : ""),
    koreanName = String(input.koreanName ?? "").trim() || null,
    parentId = level.parent ? input.parentId || null : null;
  if (
    catalog.version === 2 &&
    ["subcomponents", "l3", "l4"].includes(key) &&
    !koreanName
  )
    throw Error("한글 명칭을 입력해 주세요.");
  if (!code || !name) throw Error("ID와 명칭을 입력해 주세요.");
  if (code.length > 120 || name.length > 200 || (koreanName?.length ?? 0) > 200)
    throw Error("ID는 120자, 명칭은 200자 이내로 입력해 주세요.");
  if (catalog[key].some((x) => x.id !== id && x.code === code))
    throw Error("같은 계층에 이미 사용 중인 ID입니다.");
  if (level.parent && !catalog[level.parent].some((x) => x.id === parentId))
    throw Error("상위 항목을 선택해 주세요.");
  const node = {
    ...old,
    id: old?.id ?? crypto.randomUUID(),
    code,
    name,
    koreanName,
    parentId,
  };
  if (catalog.version === 1 && key === "subcomponents")
    node.assigneeIds = old?.assigneeIds ?? [];
  if (catalog.version === 2 && ["subcomponents", "l3", "l4"].includes(key)) {
    node.designerId = old
      ? old.designerId
      : key === "subcomponents"
        ? null
        : key === "l3"
          ? catalog.subcomponents.find((sc) => sc.id === parentId).designerId
          : catalogSubcomponent(catalog, "l3", parentId).designerId;
    if (key === "l4") {
      node.developerId = old?.developerId ?? null;
      node.phase = old?.phase ?? null;
    }
  }
  if (key === "l4") {
    node.description = String(input.description ?? "").trim() || null;
    if (typeof input.required !== "boolean")
      throw Error("필수/옵션을 선택해 주세요.");
    node.required = input.required;
    if ((node.description?.length ?? 0) > 20000)
      throw Error("기능 설명은 20,000자 이내로 입력해 주세요.");
  }
  if (old) catalog[key][catalog[key].findIndex((x) => x.id === id)] = node;
  else catalog[key].push(node);

function deleteCatalogNode(catalog, key, id) {
  const level = catalogLevel(key),
    node = catalog[key].find((x) => x.id === id);
  if (!node) throw Error("삭제할 항목이 없습니다.");
  const child = CATALOG_LEVELS.find((x) => x.parent === key),
    count = child
      ? catalog[child.key].filter((x) => x.parentId === id).length
      : 0;
  if (count)
    throw Error(
      `하위 ${child.label} ${count}건을 먼저 이동하거나 삭제해 주세요.`,
    );
  if (
    (key === "subcomponents" && node.assigneeIds?.length) ||
    node.designerId ||
    node.developerId

    throw Error("담당자 연결을 먼저 해제해 주세요.");
  catalog[key] = catalog[key].filter((x) => x.id !== id);
}
function setCatalogAssignees(data, subcomponentId, ids, today) {
  if (data.catalog?.version !== 1)
    throw Error("복수 담당자 편집은 이전 형식에서만 지원합니다.");
  const node = data.catalog?.subcomponents.find((x) => x.id === subcomponentId);
  if (!node) throw Error("담당자를 연결할 Sub Component가 없습니다.");
  if (!Array.isArray(ids) || new Set(ids).size !== ids.length)
    throw Error("담당자를 중복 선택할 수 없습니다.");
  for (const id of ids) {
    const p = data.people.find((p) => p.id === id);
    if (!p) throw Error("선택한 인력이 없습니다.");
    if (
      p.kind === "confirmed" &&
      p.end < today &&
      !node.assigneeIds.includes(id)
    )
      throw Error("종료 인력을 새 담당자로 지정할 수 없습니다.");
  }
  node.assigneeIds = [...ids];
}
function cleanCatalogAssignments(data) {
  if (!data.catalog) return;
  const ids = new Set(data.people.map((p) => p.id));
  for (const level of CATALOG_LEVELS)
    for (const node of data.catalog[level.key]) {
      if (node.assigneeIds)
        node.assigneeIds = node.assigneeIds.filter((id) => ids.has(id));
      if (node.legacyAssigneeIds)
        node.legacyAssigneeIds = node.legacyAssigneeIds.filter((id) =>
          ids.has(id),
        );
      if (node.designerId && !ids.has(node.designerId)) node.designerId = null;
      if (node.developerId && !ids.has(node.developerId))
        node.developerId = null;
    }
}

      type: ["정직원", "BP", "AGS"],
      role: ["designer", "developer"],

      "role",
      "tech",
      "start",
      "end",
      "name",

        typeOf(d, b) === "정직원" &&
        !a.roleId &&
        !b.roleId

function phaseTimeline(phases, today = todayKST()) {
  dateValue(today);
  if (!phases.length)
    return { rows: [], ticks: [], current: [], position: null, range: "empty" };

  allDates.forEach(dateValue);
  const start = allDates.reduce((a, b) => (a < b ? a : b)),
    end = allDates.reduce((a, b) => (a > b ? a : b));
  const first = dateValue(start),
    duration = dateValue(end) - first + 86400000;
  const at = (date) => ((dateValue(date) - first) / duration) * 100;
  const rows = phases.map(([name, ds, de, cs, ce]) => ({
    name,
    periods: [
      ["설계", ds, de],
      ["개발", cs, ce],
    ].map(([kind, start, end]) => {
      if (end < start)
        throw Error("Phase 종료일은 시작일보다 빠를 수 없습니다.");
      return {
        kind,
        start,
        end,
        left: at(start),
        width: ((days(start, end) * 86400000) / duration) * 100,
        state: today < start ? "upcoming" : today > end ? "past" : "current",
      };
    }),
  }));
  const ticks = [{ date: start, left: 0 }];
  let year = Number(start.slice(0, 4)),
    month = Number(start.slice(5, 7));
  while (year <= Number(end.slice(0, 4))) {
    if ([1, 4, 7, 10].includes(month)) {
      const date = `${year}-${String(month).padStart(2, "0")}-01`;
      if (date > start && date <= end && at(date) < 95)
        ticks.push({ date, left: at(date) });
    }
    month++;
    if (month === 13) {
      year++;
      month = 1;
    }

  }
  // Keep both ends readable for very short custom schedules as well.
  const readable = ticks.filter(
    (t, i) => i === 0 || (t.left >= 8 && t.left <= 92),
  );
  if (days(start, end) > 1) readable.push({ date: end, left: 100 });
  return {
    rows,
    ticks: readable,
    start,
    end,
    position: Math.max(0, Math.min(100, at(today))),
    range: today < start ? "before" : today > end ? "after" : "during",
    current: rows.flatMap((row) =>
      row.periods
        .filter((p) => p.state === "current")

    ),
  };
}

class FolderStore {
  constructor(directory) {
    this.directory = directory;
    this.version = null;
    this.baseline = null;
    this.exists = false;
  }
  async permission(request = false) {
    const options = { mode: "readwrite" };

      state = await this.directory.requestPermission(options);

    }
  }
  async raw() {
    try {
      return await (await this.directory.getFileHandle(DATA_FILE))
        .getFile()

    } catch (e) {
      if (e.name === "NotFoundError") return null;
      throw e;
    }
  }
  async load() {
    await this.permission();
    const raw = await this.raw();
    if (raw === null) {
      this.exists = false;
      this.baseline = null;
      this.version = null;
      return null;
    }
    let d;
    try {
      d = validateData(JSON.parse(raw));
    } catch (e) {
      throw Error("데이터를 읽을 수 없습니다. " + e.message);
    }
    this.exists = true;
    this.baseline = raw;
    this.version = d.saveVersion;
    return d;
  }
  async save(data) {
    await this.permission();
    validateData(data);
    const current = await this.raw();
    if (current !== this.baseline)
      throw Error(
        "다른 탭 또는 프로그램에서 데이터가 변경되었습니다. 저장을 중단했습니다. 현재 작업을 확인하고 새로고침해 주세요.",
      );
    const out = clone(data);
    out.saveVersion = (this.version ?? 0) + 1;
    const text = JSON.stringify(out, null, 2) + "\n";
    const handle = await this.directory.getFileHandle(DATA_FILE, {
      create: true,
    });
    let stream;
    try {
      stream = await handle.createWritable();
      await stream.write(text);
      await stream.close();
    } catch (e) {
      if (stream)
        try {
          await stream.abort();
        } catch {}

    this.version = out.saveVersion;

}

function upcoming() {
  const t = todayKST(),
    last = addDays(t, state.range),
    out = [];
  for (const p of state.data.people) {
    if (p.start > t && p.start <= last)
      out.push({ p, date: p.start, kind: p.kind === "tbd" ? "TBD" : "투입" });
    if (p.kind === "confirmed" && p.end >= t && p.end <= last)
      out.push({ p, date: p.end, kind: "철수" });
  }
  return out.sort(
    (a, b) =>
      a.date.localeCompare(b.date) || a.p.name.localeCompare(b.p.name, "ko"),
  );
}

async function dispatch(b) {

        render();
        break;
      case "save":
        await save();
        break;
      case "connection":
        await connect(true);
        break;
      case "catalog-initialize":
        await initializeCatalog(b.dataset.mode);
        break;
      case "catalog-level":
        state.catalogLevel = b.dataset.level;
        state.catalogQuery = "";
        state.catalogRequirement = "all";
        state.catalogPhase = "all";
        render(true);
        break;
      case "catalog-add":
        catalogNodeDialog();
        break;
      case "catalog-edit":
        catalogNodeDialog(b.dataset.level, b.dataset.id);
        break;
      case "catalog-drill":
        catalogNavigate(b.dataset.level, b.dataset.id);
        break;
      case "catalog-upgrade":
        catalogUpgradeDialog();
        break;
      case "catalog-context-designer":
        await catalogApplyDesigner(
          "subcomponents",
          b.dataset.id,
          $("#catalog-context-sc").value || null,
        );
        break;
      case "catalog-clear-filters":
        state.catalogFilters = {};
        state.catalogQuery = "";
        state.catalogRequirement = "all";
        state.catalogPhase = "all";
        render(true);
        break;
      case "add-person":
        personDialog();
        break;
      case "add-tbd":
        personDialog(null, "tbd");
        break;
      case "person":
        personDialog(b.dataset.id);
        break;
      case "sort":
        state.desc = state.sort === b.dataset.column ? !state.desc : false;
        state.sort = b.dataset.column;
        render(true);
        break;
      case "default-sort":
        state.sort = null;
        state.desc = false;
        render(true);
        break;
      case "target":
        targetDialog();
        break;
      case "previous-year":
        state.year = Math.max(1000, state.year - 1);
        render(true);
        break;
      case "next-year":
        state.year = Math.min(9999, state.year + 1);
        render(true);
        break;
      case "schedule":
        scheduleDialog();
        break;
      case "calculator":
        calculatorDialog();
        break;
      case "view-plan":
        state.viewPlan = b.dataset.id;

        break;

      case "apply-plan":
        if (
          await confirmDialog(
            "이 안 적용",
            `${viewedPlan().name}을 인력 목록의 소속 표시 기준으로 적용합니다. 인력·M/M·공통 직책은 바뀌지 않습니다.`,

        break;
      case "compare":
        compareSelect();
        break;
      case "add-group":
        groupDialog();
        break;
      case "edit-group":
        groupDialog(b.dataset.id);
        break;
      case "add-parent":
        parentDialog();
        break;
      case "edit-parent":
        parentDialog(b.dataset.id);
        break;
      case "chief":
        chiefDialog();
        break;
      case "representatives":
        representativesDialog();
        break;
      case "settings-tab":
        state.settings = b.dataset.tab;
        render(true);

        masterDialog(state.settings);

async function save() {

  state.busy = true;
  render(true);
  try {
    state.data = await state.store.save(state.data);
    state.dirty = false;
    toast("저장했습니다.");
    return true;
  } catch (e) {
    dialog({
      title: "저장하지 못했습니다",
      body: `<div class="error" role="alert">${esc(e.message)}</div><p>현재 변경 사항은 유지됩니다. 원인을 해결한 뒤 다시 저장해 주세요.</p>${["NotAllowedError", "NotFoundError", "SecurityError"].includes(e.name) ? button("repair-connection", "앱 폴더 연결", "primary") : ""}`,
      guard: false,

        f.querySelector("[data-action=repair-connection]")?.addEventListener(
          "click",

                  mode: "readwrite",
                  id: "nova-folder",
                }),
                candidate = new FolderStore(handle);
              await candidate.permission(true);
              await candidate.load();
              if (candidate.baseline !== state.store.baseline)
                throw Error(
                  "현재 작업과 연결된 앱 폴더를 선택해 주세요. 다른 데이터로 연결하지 않았습니다.",
                );
              state.store = candidate;
              state.handle = handle;
              try {
                await rememberHandle(handle);
              } catch {}
              item.close(true);
              await save();
            } catch (e) {
              if (e.name !== "AbortError") toast(e.message);

async function pendingChanges() {

  return new Promise((resolve) => {
    const item = dialog({
      title: "저장하지 않은 변경 사항",
      body: "<p>진행하기 전에 현재 변경 사항을 어떻게 처리할까요?</p>",
      apply: "저장 후 진행",
      guard: false,
      left: button("discard-session", "저장하지 않고 진행", "danger"),
      onApply: async () => {
        if (await save()) resolve(true);
        else return false;
      },
      onClose: () => resolve(false),
      setup: (f, item) => {
        f.querySelector("[data-action=discard-session]").onclick = () => {
          resolve(true);
          item.close(true);
        };
      },
    });
  });
}
async function connect(replace = false) {
  if (replace && !(await pendingChanges())) return;
  if (!window.showDirectoryPicker) {
    state.error =
      "이 브라우저는 앱 폴더 연결을 지원하지 않습니다. 최신 Edge 또는 Chrome에서 열어 주세요.";
    renderConnection();
    return;
  }
  try {
    const handle = await showDirectoryPicker({
      mode: "readwrite",
      id: "nova-folder",
    });
    await openHandle(handle, true, replace);
  } catch (e) {
    if (e.name !== "AbortError") {
      if (state.ready) toast(e.message);
      else {
        state.error = e.message;
        renderConnection();
      }
    }
  }
}
async function openHandle(handle, request = false, replace = false) {
  const previous = {
    data: state.data,
    store: state.store,
    handle: state.handle,
    ready: state.ready,
    dirty: state.dirty,
  };
  state.handle = handle;
  state.busy = true;
  if (!replace) renderConnection();
  try {
    const store = new FolderStore(handle);
    await store.permission(request);
    let data = await store.load();
    if (data === null) {
      if (
        !(await confirmDialog(
          "새 워크스페이스 만들기",
          "이 폴더에 NOVA 초기 데이터가 없습니다. 확정 인력 14명과 TBD 5명으로 새 데이터를 만들까요?",
          "만들기",
        ))
      ) {
        Object.assign(state, previous);
        state.busy = false;
        render();
        return;
      }
      const result = await startup(seed(), {
        choose: (title, people) => choose(title, people, seed()),
      });
      data = await store.save(result.data);
    } else {
      const result = await startup(data, {
        choose: (title, people) => choose(title, people, data),
      });
      data = result.changed ? await store.save(result.data) : result.data;
    }
    state.data = data;
    state.store = store;
    state.ready = true;
    state.dirty = false;
    state.error = "";
    state.viewPlan = data.appliedPlanId;
    try {
      await rememberHandle(handle);
    } catch {
      toast(
        "폴더 연결을 기억하지 못했습니다. 다음 실행 시 다시 연결해 주세요.",
      );
    }
    render();
  } catch (e) {
    if (previous.ready) {
      Object.assign(state, previous);
      toast("연결을 변경하지 못했습니다. " + e.message);
    } else {
      state.ready = false;
      state.error = [
        "NotAllowedError",
        "NotFoundError",
        "SecurityError",
      ].includes(e.name)
        ? "앱 폴더 연결 또는 접근 권한을 다시 확인해 주세요."
        : e.message;
    }
    render();
  } finally {
    state.busy = false;
    render(true);
  }
}

async function deletePerson(id) {

    warnings.push(
      `Catalog: ${sc.code} (${sc.koreanName || sc.name}) 담당자 연결 해제`,
    );
  for (const plan of state.data.plans) {
    for (const g of [...plan.groups, ...plan.parents])
      if (g.leaderId === id)
        warnings.push(`${plan.name}: 해당 인력 삭제 시 (${g.name}) 확인 필요`);
  }
  if (
    !(await confirmDialog(
      `${p.name} 삭제`,
      `${p.name}의 투입 기록을 삭제합니다.\n${warnings.join("\n")}`,
      "삭제",
    ))

    return false;

    (d) => {
      d.people = d.people.filter((x) => x.id !== id);
    },
    { refs: true },
  );
  return true;
}

function compareDialog(ids) {

    const g = groupOf(id, p),
      parent = p.parents.find((x) => x.groupIds.includes(g?.id));

      g?.members.slice().sort().join(","),
      g?.leaderId === id,
      parent?.name ?? "",
      parent?.leaderId === id,

    wide: true,

          .map((p) => {
            const g = groupOf(p.id, plan),
              parent = plan.parents.find((x) => x.groupIds.includes(g?.id)),

}

let dragData = null;
function bindDrag() {
  const root = $("main");
  if (!root) return;
  let pendingDrop = null;
  const defaultHint = $("#drag-feedback")?.textContent;
  const clearMarkers = () =>
    root.querySelectorAll("[data-drop-intent]").forEach((el) => {
      el.removeAttribute("data-drop-intent");
      el.removeAttribute("data-drop-axis");
    });
  const describe = (e, drag) => {
    if (!drag || drag.planId !== viewedPlan().id) return null;
    const card = e.target.closest("[data-drop-group]"),
      parent = e.target.closest("[data-drop-parent]"),
      unassigned = e.target.closest("[data-drop-unassigned]"),
      outside = e.target.closest("[data-drop-ungrouped]");
    const side = (el, axis) => {
      const r = el.getBoundingClientRect();
      return (
        axis === "horizontal"
          ? e.clientX < r.x + r.width / 2
          : e.clientY < r.y + r.height / 2
      )
        ? "before"
        : "after";
    };
    if (drag.person) {
      if (card)
        return {
          el: card,
          kind: "person",
          groupId: card.dataset.dropGroup,
          beforePerson:
            e.target.closest("[data-drop-person]")?.dataset.dropPerson,
          label: "이 그룹에 인력 배정",
          intent: "inside",
        };
      if (unassigned)
        return {
          el: unassigned,
          kind: "person",
          label: "미배정으로 이동",
          intent: "inside",
        };
      return null;
    }
    if (drag.parent) {
      const el = parent || card;
      if (el) {
        const id = parent?.dataset.dropParent || card.dataset.dropGroup;
        if (id === drag.parent) return null;
        const intent = side(el, "vertical");
        return {
          el,
          kind: "parent",
          anchorId: id,
          after: intent === "after",
          intent,
          axis: "vertical",
          label:
            intent === "after" ? "이 항목 뒤로 이동" : "이 항목 앞으로 이동",
        };
      }
      if (outside)
        return {
          el: outside,
          kind: "parent",
          intent: "inside",
          label: "맨 뒤로 이동",
        };
      return null;
    }
    if (drag.group) {
      if (card) {
        if (card.dataset.dropGroup === drag.group) return null;
        const r = card.getBoundingClientRect(),
          horizontal = Math.min(48, r.width * 0.18),
          vertical = Math.min(32, r.height * 0.18);
        let intent = null,
          axis = "horizontal";
        if (e.clientX < r.x + horizontal) intent = "before";
        else if (e.clientX > r.right - horizontal) intent = "after";
        else if (e.clientY < r.y + vertical) {
          intent = "before";
          axis = "vertical";
        } else if (e.clientY > r.bottom - vertical) {
          intent = "after";
          axis = "vertical";
        }
        const parentId = parent?.dataset.dropParent ?? null;
        if (intent)
          return {
            el: card,
            kind: "group",
            parentId,
            anchorId: card.dataset.dropGroup,
            after: intent === "after",
            intent,
            axis,
            label:
              intent === "after" ? "이 그룹 뒤로 이동" : "이 그룹 앞으로 이동",
          };
        if (parentId)
          return {
            el: card,
            kind: "group",
            parentId,
            anchorId: card.dataset.dropGroup,
            after: true,
            intent: "inside",
            label:
              viewedPlan().parents.find((p) => p.groupIds.includes(drag.group))
                ?.id === parentId
                ? "이 그룹 뒤로 이동"
                : "이 상위 그룹에 넣기",
          };
        return {
          el: card,
          kind: "bundle",
          anchorId: card.dataset.dropGroup,
          intent: "inside",
          label: "두 그룹을 상위 그룹으로 묶기",
        };
      }
      if (parent) {
        const r = parent.getBoundingClientRect();
        if (e.clientY < r.y + 18 || e.clientY > r.bottom - 18) {
          const intent = side(parent, "vertical");
          return {
            el: parent,
            kind: "group",
            anchorId: parent.dataset.dropParent,
            parentId: null,
            after: intent === "after",
            intent,
            axis: "vertical",
            label:
              intent === "after"
                ? "상위 그룹 뒤에 독립 배치"
                : "상위 그룹 앞에 독립 배치",
          };
        }
        return {
          el: parent,
          kind: "group",
          parentId: parent.dataset.dropParent,
          intent: "inside",
          label: "이 상위 그룹에 넣기",
        };
      }
      if (outside)
        return {
          el: outside,
          kind: "group",
          parentId: null,
          intent: "inside",
          label: "상위 그룹 밖, 맨 뒤로 이동",
        };
    }
    return null;
  };
  root.querySelectorAll("[draggable=true]").forEach((el) =>
    el.addEventListener("dragstart", (e) => {
      e.stopPropagation();
      dragData = {
        planId: viewedPlan().id,
        person: el.dataset.dragPerson,
        group: el.dataset.dragGroup,
        parent: el.dataset.dragParent,
      };
      el.classList.add("dragging");
      root.classList.add("is-dragging");
      e.dataTransfer.setData("text/plain", "nova-move");
      e.dataTransfer.effectAllowed = "move";
    }),
  );
  root.addEventListener("dragover", (e) => {
    const target = describe(e, dragData);
    clearMarkers();
    if (target) {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      target.el.dataset.dropIntent = target.intent;
      target.el.dataset.dropAxis = target.axis || "horizontal";
    }
    const feedback = $("#drag-feedback");
    if (feedback) feedback.textContent = target?.label || defaultHint;
  });
  root.addEventListener("dragleave", (e) => {
    if (!root.contains(e.relatedTarget)) clearMarkers();
  });
  root.addEventListener("drop", (e) => {
    const target = describe(e, dragData),
      drag = dragData;
    if (!target) return;
    e.preventDefault();
    pendingDrop = async () => {
      try {
        if (target.kind === "bundle") {
          parentDialog(null, {
            planId: drag.planId,
            groupIds: [target.anchorId, drag.group],
            anchorId: target.anchorId,
          });
          return;
        }
        await mutate((d) => {
          const plan = d.plans.find((p) => p.id === drag.planId);
          if (!plan) throw Error("구성안이 없습니다.");
          if (target.kind === "person") {
            const p = d.people.find((p) => p.id === drag.person);
            if (!p || status(p) === "종료") return;
            const was = plan.groups.find((g) => g.members.includes(p.id)),
              oldIndex = was?.members.indexOf(p.id);
            for (const g of plan.groups)
              g.members = g.members.filter((id) => id !== p.id);
            const group = plan.groups.find((g) => g.id === target.groupId);
            if (group) {
              let index =
                target.beforePerson === p.id
                  ? oldIndex
                  : group.members.indexOf(target.beforePerson);
              if (index < 0) index = group.members.length;
              group.members.splice(index, 0, p.id);
            }
          } else if (target.kind === "group")
            moveGroup(plan, drag.group, target);
          else if (target.kind === "parent")
            moveParent(plan, drag.parent, target.anchorId, target.after);
          cleanGroups(d);
        });
      } catch (e) {
        toast(e.message);
      }
    };
  });
  root.addEventListener("dragend", () => {
    dragData = null;
    clearMarkers();
    root.classList.remove("is-dragging");
    root
      .querySelectorAll(".dragging")
      .forEach((el) => el.classList.remove("dragging"));
    const feedback = $("#drag-feedback");
    if (feedback) feedback.textContent = defaultHint;
    const run = pendingDrop;
    pendingDrop = null;
    if (run) setTimeout(run, 0);
  });
}
window.addEventListener("beforeunload", (e) => {

// Refresh derived date displays across midnight without running persistent startup cleanup.
let renderedDate = todayKST();
function refreshDateDisplay() {

    document.hidden ||
    dialogs.length ||

}

async function boot() {
  renderConnection();

    if (handle) {
      state.handle = handle;
      const permission = await handle.queryPermission({ mode: "readwrite" });
      if (permission === "granted") await openHandle(handle);

  } catch {
    state.error =
      "폴더 연결 정보를 기억하지 못했습니다. 앱 폴더를 다시 연결해 주세요.";
    renderConnection();
  }
}
